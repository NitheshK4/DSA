name: Auto-Sync DSA README

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.problem_cache.json'
  schedule:
    # Run every day at 00:00 UTC to refresh profile stats and rankings
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run README Sync Script
        run: |
          python3 scripts/sync_readme.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md .problem_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs(readme): 🤖 auto-sync leetcode solutions and stats [skip ci]" && git push)
